<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#FFF8F3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1611" media="(prefers-color-scheme: dark)">
    <title>Benbow</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #FFF8F3; }
        @media (prefers-color-scheme: dark) { html, body { background: #1C1611; } }
        /* Shown while the app loads (several MB of WebAssembly the first time), then faded out by the app. */
        #loading { position: fixed; inset: 0; z-index: 10; background: inherit; display: flex; flex-direction: column;
                   align-items: center; justify-content: center; gap: 22px; transition: opacity .25s ease-out;
                   font: 15px system-ui, sans-serif; color: #8A7F74; }
        #loading img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); }
        #loading .bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(217, 130, 43, .2); overflow: hidden; }
        #loading .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: #D9822B;
                               animation: benbow-slide 1.1s ease-in-out infinite; }
        #loading .error { max-width: 420px; padding: 0 24px; text-align: center; }
        #loading.gone { opacity: 0; pointer-events: none; }
        @keyframes benbow-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
    <script type="application/javascript" src="benbow.js"></script>
</head>
<body><div id="loading"><img src="favicon.svg" alt=""><div class="bar"></div></div></body>
</html>
