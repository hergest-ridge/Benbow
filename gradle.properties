# The one version of Benbow (ADR-042, U1): the server, the web client it serves and the Android app it carries.
# The app's versionCode comes from it (major * 1,000,000 + minor * 1,000 + patch); raise it for every release.
benbow.version=0.16.0

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
